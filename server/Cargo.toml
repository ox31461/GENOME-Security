[package]
name = "genome-risk-engine"
version = "0.1.0"
edition = "2021"
description = "GENOME Security Phase 2 server risk engine: DPoP verification, WebAuthn, Asymmetric Learning Gate, and synthetic-input detection."
license = "Apache-2.0"

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webauthn-rs = { version = "0.5", default-features = false, features = ["danger-allow-state-serialisation"] }
# webauthn-rs-core links OpenSSL unconditionally for COSE/attestation signature verification.
# No system OpenSSL/pkg-config is assumed on build machines, so we force the vendored
# (build-from-source) OpenSSL via direct feature unification with this explicit dependency.
openssl = { version = "0.10", features = ["vendored"] }
rusqlite = { version = "0.31", features = ["bundled"] }
jsonwebtoken = "9"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
rand_distr = "0.4"
p256 = { version = "0.13", features = ["ecdsa"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
url = "2"
parking_lot = "0.12"

[dev-dependencies]
tokio-test = "0.4"
